services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: sportscenter_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d sportscenter_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "test-only-password"]
    environment:
      REDISCLI_AUTH: test-only-password
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
